<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif">
  <rect width="720" height="400" rx="14" fill="#ffffff"/>
  <text x="24" y="32" font-size="12" fill="#8aa0bf">会话状态</text>
  <text x="196" y="32" font-size="12" fill="#8aa0bf">默认表情（stateMap 里可改）</text>

  <!-- thinking -->
  <circle cx="34" cy="66" r="6" fill="#7aa7ff"/>
  <text x="52" y="71" font-size="14" fill="#24406e">思考中</text>
  <g>
    <rect x="196" y="48" width="74" height="26" rx="13" fill="#f0f5ff" stroke="#d6e3fd"/><text x="233" y="65" font-size="12" fill="#35507e" text-anchor="middle">前倾</text>
    <rect x="278" y="48" width="88" height="26" rx="13" fill="#f0f5ff" stroke="#d6e3fd"/><text x="322" y="65" font-size="12" fill="#35507e" text-anchor="middle">圈圈眼</text>
    <rect x="374" y="48" width="88" height="26" rx="13" fill="#f0f5ff" stroke="#d6e3fd"/><text x="418" y="65" font-size="12" fill="#35507e" text-anchor="middle">屑屑眼</text>
    <text x="476" y="65" font-size="11.5" fill="#8aa0bf">偶尔歪头</text>
  </g>

  <!-- working -->
  <circle cx="34" cy="122" r="6" fill="#4fae74"/>
  <text x="52" y="127" font-size="14" fill="#24406e">干活中</text>
  <g>
    <rect x="196" y="104" width="74" height="26" rx="13" fill="#f1faf4" stroke="#cfe9d8"/><text x="233" y="121" font-size="12" fill="#2f6b4a" text-anchor="middle">兔牙</text>
    <rect x="278" y="104" width="74" height="26" rx="13" fill="#f1faf4" stroke="#cfe9d8"/><text x="315" y="121" font-size="12" fill="#2f6b4a" text-anchor="middle">前倾</text>
    <rect x="360" y="104" width="102" height="26" rx="13" fill="#f1faf4" stroke="#cfe9d8"/><text x="411" y="121" font-size="12" fill="#2f6b4a" text-anchor="middle">单片眼镜</text>
    <text x="476" y="121" font-size="11.5" fill="#8aa0bf">换重心 / 抖尾巴</text>
  </g>

  <!-- waiting -->
  <circle cx="34" cy="178" r="6" fill="#f0a63c"/>
  <text x="52" y="183" font-size="14" fill="#24406e">等你确认</text>
  <g>
    <rect x="196" y="160" width="60" height="26" rx="13" fill="#fef8ec" stroke="#f2e0bd"/><text x="226" y="177" font-size="12" fill="#7a5a1f" text-anchor="middle">＞＜</text>
    <rect x="264" y="160" width="88" height="26" rx="13" fill="#fef8ec" stroke="#f2e0bd"/><text x="308" y="177" font-size="12" fill="#7a5a1f" text-anchor="middle">流冷汗</text>
    <text x="364" y="177" font-size="11.5" fill="#b58a3a">← 看到这个就去看窗口</text>
  </g>

  <!-- success -->
  <circle cx="34" cy="234" r="6" fill="#f2749f"/>
  <text x="52" y="239" font-size="14" fill="#24406e">完成</text>
  <g>
    <rect x="196" y="216" width="88" height="26" rx="13" fill="#fef1f6" stroke="#f7d5e3"/><text x="240" y="233" font-size="12" fill="#8c3a5c" text-anchor="middle">爱心眼</text>
    <rect x="292" y="216" width="60" height="26" rx="13" fill="#fef1f6" stroke="#f7d5e3"/><text x="322" y="233" font-size="12" fill="#8c3a5c" text-anchor="middle">脸红</text>
    <rect x="360" y="216" width="60" height="26" rx="13" fill="#fef1f6" stroke="#f7d5e3"/><text x="390" y="233" font-size="12" fill="#8c3a5c" text-anchor="middle">＞＜</text>
    <text x="436" y="233" font-size="11.5" fill="#8aa0bf">抖尾巴</text>
  </g>

  <!-- error -->
  <circle cx="34" cy="290" r="6" fill="#e05f5f"/>
  <text x="52" y="295" font-size="14" fill="#24406e">出错</text>
  <g>
    <rect x="196" y="272" width="88" height="26" rx="13" fill="#fdf2f2" stroke="#f5d3d3"/><text x="240" y="289" font-size="12" fill="#8c3b3b" text-anchor="middle">流冷汗</text>
    <rect x="292" y="272" width="60" height="26" rx="13" fill="#fdf2f2" stroke="#f5d3d3"/><text x="322" y="289" font-size="12" fill="#8c3b3b" text-anchor="middle">黑脸</text>
    <rect x="360" y="272" width="88" height="26" rx="13" fill="#fdf2f2" stroke="#f5d3d3"/><text x="404" y="289" font-size="12" fill="#8c3b3b" text-anchor="middle">圈圈眼</text>
    <text x="460" y="289" font-size="11.5" fill="#8aa0bf">扣钢盆</text>
  </g>

  <!-- idle -->
  <circle cx="34" cy="346" r="6" fill="#c3cfe2"/>
  <text x="52" y="351" font-size="14" fill="#24406e">待机 / 完成回执</text>
  <g>
    <rect x="196" y="328" width="102" height="26" rx="13" fill="#f5f7fb" stroke="#e0e6f1"/><text x="247" y="345" font-size="12" fill="#5b7396" text-anchor="middle">默认体型</text>
    <text x="308" y="345" font-size="11.5" fill="#8aa0bf">呼吸 / 眨眼 / 重心变化</text>
  </g>
</svg>
