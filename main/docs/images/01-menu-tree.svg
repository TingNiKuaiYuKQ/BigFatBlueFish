    <text x="600" y="250">省电模式</text>
    <text x="600" y="305">退下吧</text>
  </g>

  <!-- 底部说明 -->
  <text x="20" y="368" font-size="12" fill="#8aa0bf">第三级里倒数第二颗永远是「返回」，最底下那颗永远是输入框</text>
